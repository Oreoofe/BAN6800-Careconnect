# Continuous integration: runs on every push and pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: scripts/run_logged.sh pip install -r requirements-build.txt
      - name: Lint (syntax errors, undefined names)
        run: scripts/run_logged.sh ruff check .
      - name: Verify no data files committed (Module 1 no-PII rule)
        run: |
          if git ls-files | grep -E '\.(csv|parquet|pkl|xlsx)$|^data/raw|^data/processed'; then
            echo "Data file committed - violation of the no-PII rule"; exit 1; fi
      - name: Unit tests (pipeline, fairness, policy, drift, API contract)
        run: scripts/run_logged.sh pytest -v -x
      - name: Pipeline smoke test on synthetic data
        run: |
          scripts/run_logged.sh python -m tools.make_sample_data
          scripts/run_logged.sh python -m careconnect.pipeline.run --sample

  docker:
    name: docker compose build + API smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start API + dashboard
        run: docker compose up -d --build api dashboard
      - name: Wait for health and score one appointment
        run: scripts/run_logged.sh bash scripts/smoke_api.sh
      - name: Show container status
        if: always()
        run: docker compose ps && docker compose logs --tail=50
