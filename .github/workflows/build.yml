# Full build / scheduled retraining. Produces the model, MLflow runs, explanations, fairness results,
# monitoring report, model card, promotion decision and an independent verification report as
# downloadable artifacts. It never commits or promotes a model: a person reviews the outputs and the
# Ethics Committee approves. Later steps run even if an earlier one fails, so every failure is visible.
name: build-and-retrain
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"        # monthly retraining review (1st of each month, 06:00 UTC)

permissions:
  contents: write    # only used to publish this run's outputs to a separate build-outputs-<run> branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARECONNECT_CV_FOLDS: "5"
      CARECONNECT_SALT: ${{ secrets.CARECONNECT_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          scripts/run_logged.sh pip install -r requirements-build.txt -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          pip freeze > requirements-lock.txt
      - name: Run pipeline, training, XAI, fairness, monitoring, model card, promotion gate
        run: scripts/run_logged.sh python -m careconnect.run_all
      - name: Independent verification of results (recomputed from saved model and test set)
        if: success() || failure()
        run: scripts/run_logged.sh python scripts/verify_results.py
      - name: API demo against the new model
        if: success() || failure()
        run: scripts/run_logged.sh python api_demo.py
      - name: Tests against the new artifacts (incl. dashboard rendering)
        if: success() || failure()
        run: scripts/run_logged.sh pytest -v --junitxml=test-results.xml
      - name: MLflow UI screenshots (experiment + model registry)
        if: success() || failure()
        run: scripts/run_logged.sh python scripts/mlflow_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careconnect-build-${{ github.run_number }}
          retention-days: 30
          path: |
            artifacts/*.json
            artifacts/xgboost.joblib
            artifacts/xgboost_minimal.joblib
            artifacts/figures/
            artifacts/pipeline/
            artifacts/monitoring/
            docs/model_card.md
            docs/api_demo_output.txt
            docs/evidence/
            mlruns/mlflow.db
            logs/audit.log
            requirements-lock.txt
            test-results.xml
      - name: Publish outputs to branch build-outputs-${{ github.run_number }} (readable without artifact storage)
        if: always()
        run: |
          set -e
          OUT=$(mktemp -d)
          for f in artifacts/*.json artifacts/xgboost.joblib artifacts/xgboost_minimal.joblib docs/model_card.md \
                   docs/api_demo_output.txt requirements-lock.txt test-results.xml logs/audit.log mlruns/mlflow.db; do
            [ -e "$f" ] && mkdir -p "$OUT/$(dirname $f)" && cp "$f" "$OUT/$f" || true
          done
          for d in artifacts/figures artifacts/pipeline artifacts/monitoring docs/evidence; do
            [ -d "$d" ] && mkdir -p "$OUT/$d" && cp -r "$d/." "$OUT/$d/" || true
          done
          cd "$OUT"
          git init -q -b "build-outputs-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build outputs: run ${{ github.run_id }} from ${{ github.ref_name }}@${{ github.sha }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/build-outputs-${{ github.run_number }}"
