# AUDIT BRANCH ONLY (audit-27943a1): independent re-computation of the Cycle 5 evidence.
# This replaces the build workflow on this branch only; capstone-verify and main are unchanged.
name: build-and-retrain
on:
  workflow_dispatch:

permissions:
  contents: write    # only to publish the audit output to audit-outputs-<run>

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARECONNECT_SALT: ${{ secrets.CARECONNECT_SALT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: scripts/run_logged.sh pip install -r requirements-build.txt -r requirements.txt
      - name: Fetch the published Cycle 5 outputs (build-outputs-14)
        run: |
          git fetch origin build-outputs-14
          git worktree add pub origin/build-outputs-14
          (cd pub && git log --oneline -1)
      - name: Rebuild the modelling table from the raw data (project pipeline)
        run: scripts/run_logged.sh python -m careconnect.pipeline.run
      - name: Independent audit
        run: |
          mkdir -p audit-out
          set -o pipefail
          scripts/run_logged.sh python scripts/independent_audit.py pub audit-out 2>&1 | tee audit-out/audit_log.txt
      - name: Publish audit output to audit-outputs-${{ github.run_number }}
        if: always()
        run: |
          set -e
          OUT=$(mktemp -d)
          cp -r audit-out/. "$OUT/" || true
          cp scripts/independent_audit.py "$OUT/" || true
          cd "$OUT"
          git init -q -b "audit-outputs-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Independent audit output: run ${{ github.run_id }} from ${{ github.ref_name }}@${{ github.sha }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/audit-outputs-${{ github.run_number }}"
